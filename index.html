<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Кабинет</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="brand">Кабинет</div>
        <div class="avatar" id="avatar">?</div>
    </header>

    <section class="screen active" id="screen-subscription">
        <div class="title">Подписка</div>
        <div class="subtitle" id="sub-status">Загрузка...</div>
        <div class="section-label">Тарифы</div>
        <div class="card">
            <div class="row"><div>1 месяц</div><button class="btn small" data-plan="1m">150 ⭐</button></div>
        </div>
        <div class="card">
            <div class="row"><div>3 месяца</div><button class="btn small" data-plan="3m">400 ⭐</button></div>
        </div>
        <div class="card">
            <div class="row"><div>12 месяцев</div><button class="btn small" data-plan="12m">1 400 ⭐</button></div>
        </div>
        <div class="muted" style="margin-top:8px">Оплата звёздами Telegram. Счёт откроется в чате с ботом.</div>
    </section>

    <section class="screen" id="screen-profile">
        <div class="title">Профиль</div>
        <div class="subtitle">Ваши данные</div>
        <div class="card"><div class="row"><span class="muted">Имя</span><span id="p-name">—</span></div></div>
        <div class="card"><div class="row"><span class="muted">ID</span><span id="p-id">—</span></div></div>
    </section>

    <nav>
        <button class="active" data-tab="subscription">Подписка</button>
        <button data-tab="profile">Профиль</button>
    </nav>

    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
</body>
</html>
